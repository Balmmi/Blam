<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimmuki Shop</title>
    <link rel="stylesheet" href="style.css">
    <!-- นำเข้า Font น่ารักๆ -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Mitr:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- ส่วนหัว (Banner & Profile) -->
        <div class="header">
            <div class="banner">
                <img src="https://placeholder.com" alt="Banner">
            </div>
            <div class="profile-pic">
                <img src="https://placeholder.com" alt="Profile">
            </div>
        </div>

        <!-- ข้อมูลร้าน -->
        <div class="shop-info">
            <h1>pimmuki shop ♡𖦹.</h1>
            <p class="welcome">ʚ♡⃛ Welcome to Pimmuki store 𐂂</p>
            
            <div class="stats">
                <div><strong>100</strong> <br> <span>followers</span></div>
                <div><strong>0</strong> <br> <span>reviews</span></div>
            </div>
        </div>

        <!-- ส่วนเครื่องเล่นเพลง -->
        <div class="music-player">
            <div class="music-icon">🎵</div>
            <div class="music-details">
                <span class="song-title">Black magic</span>
                <span class="artist">Little Mix</span>
            </div>
            <div class="play-btn">▶</div>
        </div>

        <!-- ปุ่มติดต่อ (Contact) -->
        <div class="contact-section">
            <p class="contact-title">- ♡ ⎯⎯⎯ contact</p>
            
            <!-- ใส่ลิงก์ Facebook ของคุณแล้ว สามารถเปิดหน้าต่างใหม่เมื่อกดได้ทันที -->
            <a href="https://www.facebook.com/weethida.palmy" target="_blank" class="btn-link">👥 Facebook</a>
            
            <a href="#" class="btn-link">🔗 Line</a>
            <a href="#" class="btn-link">📸 Instagram</a>
        </div>
    </div>

</body>
</html>
